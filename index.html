<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator | Lab Work</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-flex; 
            flex-direction: column;
            align-items: center;
            min-width: 320px;
            max-width: 95vw;
            transition: all 0.5s ease;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        input[type="text"] {
            flex: 1 1 0;
            min-width: 0;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .settings {
            display: flex;
            justify-content: stretch;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            width: 100%;
            gap: 15px;
            box-sizing: border-box;
        }

        .control {
            display: flex;
            flex-direction: column;
            font-size: 0.8rem;
            gap: 8px;
            align-items: center;
            flex: 1;
        }

        .control input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }

        #contrast-warning {
            display: none;
            font-size: 0.75rem;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            line-height: 1.4;
        }

        #qr-wrapper {
            margin: 10px 0 20px 0;
            text-align: center;
        }

        #qr-container table {
            margin: 0 auto;
            border: 10px solid white;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
            display: table;
        }

        #qr-container td {
            width: 8px;
            height: 8px;
            padding: 0;
            border: none;
        }

        #download {
            margin-top: 15px;
            background: #10b981;
            width: 100%;
        }

        .history-section {
            width: 100%;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 10px;
        }

        #history-list {
            list-style: none;
            padding: 0;
            font-size: 0.85rem;
            margin: 0;
        }

        #history-list li {
            padding: 8px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 1px; 
            min-width: 100%;
        }

        #clear-history {
            background: transparent;
            color: #ef4444;
            font-size: 0.7rem;
            padding: 0;
            margin-top: 5px;
        }

        .footer { margin-top: 1.5rem; opacity: 0.5; font-size: 0.75rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Generator</h2>
    
    <div class="input-group">
        <input type="text" id="qr-text" placeholder="Введите текст или ссылку..." autocomplete="off">
        <button id="generate">Создать</button>
    </div>

    <div class="settings">
        <div class="control">
            <label>Цвет кода (тёмный)</label>
            <input type="color" id="color-dark" value="#000000">
        </div>
        <div class="control">
            <label>Цвет фона (светлый)</label>
            <input type="color" id="color-light" value="#ffffff">
        </div>
    </div>

    <div id="contrast-warning"></div>

    <div id="qr-wrapper">
        <div id="qr-container"></div>
        <button id="download" style="display: none;">Скачать PNG</button>
    </div>

    <div class="history-section">
        <h3>История</h3>
        <ul id="history-list"></ul>
        <button id="clear-history">Очистить историю</button>
    </div>

    <div class="footer">Белов Даниил • USM 2026</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="indiv.js"></script>
</body>
</html>
